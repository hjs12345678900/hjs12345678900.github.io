<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
  <title id="title">Cross-track occultation observing and a recorded light curve</title>
  <desc id="desc">Five observing stations are distributed perpendicular to the shadow motion. Three station tracks cross the asteroid shadow and measure chords, while two tracks miss. A light curve below shows the occultation duration recorded at one station.</desc>
  <defs>
    <marker id="motion-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#86d8e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="measure-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M9 1L2 5L9 9" fill="none" stroke="#ffb85c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <clipPath id="shadow-clip"><path d="M284 106L337 91L397 108L435 145L429 202L391 244L332 255L281 231L255 185L263 139Z"/></clipPath>
  </defs>

  <g font-family="DM Mono, monospace" letter-spacing=".02em">
    <text x="48" y="50" fill="#f3f0e7" fill-opacity=".82" font-size="14">Shadow plane at Earth</text>
    <text x="462" y="50" fill="#86d8e8" font-size="12" text-anchor="end">shadow motion</text>
  </g>
  <path d="M286 68H468" fill="none" stroke="#86d8e8" stroke-width="2" marker-end="url(#motion-arrow)"/>

  <path d="M284 106L337 91L397 108L435 145L429 202L391 244L332 255L281 231L255 185L263 139Z" fill="#050b13" stroke="#f3f0e7" stroke-opacity=".62" stroke-width="2"/>
  <g fill="none" stroke="#86d8e8" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="7 7">
    <path d="M220 115H558"/><path d="M220 145H558"/><path d="M220 175H558"/><path d="M220 205H558"/><path d="M220 235H558"/>
  </g>
  <g clip-path="url(#shadow-clip)" fill="none" stroke="#86d8e8" stroke-width="4" stroke-linecap="round">
    <path d="M220 145H558"/><path d="M220 205H558"/>
  </g>
  <path d="M220 175H558" clip-path="url(#shadow-clip)" fill="none" stroke="#ffb85c" stroke-width="4" stroke-linecap="round"/>
  <g fill="#f3f0e7" stroke="#0b1420" stroke-width="2">
    <circle cx="128" cy="115" r="6"/><circle cx="128" cy="145" r="6"/><circle cx="128" cy="205" r="6"/><circle cx="128" cy="235" r="6"/>
  </g>
  <circle cx="128" cy="175" r="7" fill="#ffb85c" stroke="#0b1420" stroke-width="2"/>
  <g fill="#f3f0e7" fill-opacity=".6" font-family="DM Mono, monospace" font-size="11">
    <text x="144" y="119">miss</text><text x="144" y="149">positive</text><text x="144" y="179" fill="#ffb85c" fill-opacity="1">selected station</text><text x="144" y="209">positive</text><text x="144" y="239">miss</text>
  </g>
  <path d="M95 115V235" fill="none" stroke="#ffb85c" stroke-width="1.6" marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
  <text x="72" y="175" transform="rotate(-90 72 175)" fill="#ffb85c" font-family="DM Mono, monospace" font-size="12" text-anchor="middle">stations spread cross-track</text>
  <text x="349" y="274" fill="#f3f0e7" fill-opacity=".64" font-family="DM Mono, monospace" font-size="13" text-anchor="middle">projected asteroid shadow</text>

  <path d="M48 286H592" stroke="#f3f0e7" stroke-opacity=".15"/>
  <text x="48" y="322" fill="#f3f0e7" fill-opacity=".82" font-family="DM Mono, monospace" font-size="14">Selected station light curve</text>
  <g fill="none" stroke="#f3f0e7" stroke-opacity=".1">
    <path d="M82 350H572M82 405H572M82 460H572"/><path d="M82 338V460M245 338V460M408 338V460M572 338V460"/>
  </g>
  <rect x="267" y="338" width="136" height="122" fill="#ffb85c" fill-opacity=".09"/>
  <path d="M82 351H246Q267 351 267 374V447H403V374Q403 351 424 351H572" fill="none" stroke="#f3f0e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M279 413H391" fill="none" stroke="#ffb85c" stroke-width="2" marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
  <text x="335" y="398" fill="#ffb85c" font-family="DM Mono, monospace" font-size="13" text-anchor="middle">occultation duration</text>
  <g fill="#f3f0e7" fill-opacity=".6" font-family="DM Mono, monospace" font-size="12">
    <text x="38" y="401" transform="rotate(-90 38 401)" text-anchor="middle">normalised flux</text><text x="572" y="490" text-anchor="end">time</text>
  </g>
</svg>
